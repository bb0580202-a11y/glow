<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>萤 · 暖光粒子</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16121F; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const CONFIG = {
  bgColor: '#16121F',
  countFor(w) { return w < 640 ? 90 : 180; },
  colorStops: ['#FFD79A', '#F4A65A', '#FFC078'],
  sizeMin: 1.5, sizeMax: 4,
  gamma: 0.03, sigma: 0.08,
  attractRadius: 220, attractForce: 0.6,
  breathSpeed: 0.004, glowScale: 4,
};

// 标准正态随机(Box–Muller),供 Langevin/OU 的高斯白噪声使用
function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

class Particle {
  constructor(w, h) { this.reset(w, h); }
  reset(w, h) {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.vx = 0; this.vy = 0;
    this.size = CONFIG.sizeMin + Math.random() * (CONFIG.sizeMax - CONFIG.sizeMin);
    this.color = CONFIG.colorStops[(Math.random() * CONFIG.colorStops.length) | 0];
    this.phase = Math.random() * Math.PI * 2;
    this.baseAlpha = 0.5 + Math.random() * 0.5;
  }
}

class ParticleSystem {
  constructor() { this.particles = []; }
  init(w, h) {
    this.particles = [];
    const n = CONFIG.countFor(w);
    for (let i = 0; i < n; i++) this.particles.push(new Particle(w, h));
  }
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const system = new ParticleSystem();
system.init(W, H);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3);
  last = now;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
  // Ornstein–Uhlenbeck 布朗运动:高斯白噪声(√dt 缩放)+ 黏滞阻力
  const sqrtDt = Math.sqrt(dt);
  for (const p of system.particles) {
    p.vx += -CONFIG.gamma * p.vx * dt + CONFIG.sigma * sqrtDt * gaussian();
    p.vy += -CONFIG.gamma * p.vy * dt + CONFIG.sigma * sqrtDt * gaussian();
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
