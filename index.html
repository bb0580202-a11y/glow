<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>萤 · 暖光粒子</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000000; }
  canvas { display: block; touch-action: none; }
  #cam, #scrim, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; transform: scaleX(-1); z-index: 0; display: none; }
  #scrim { background: rgba(0,0,0,0.45); z-index: 1; display: none; }
  canvas { z-index: 2; }
  #camBtn {
    position: fixed; left: 16px; bottom: 16px; z-index: 3;
    background: rgba(255,255,255,0.08); color: #FFF6E0;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #camBtn:hover { background: rgba(255,255,255,0.15); }
  #camMode { position: fixed; right: 16px; bottom: 16px; z-index: 3;
    color: rgba(255,246,224,0.6); font-size: 12px; font-family: monospace; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="scrim"></div>
<canvas id="c"></canvas>
<button id="camBtn">开启摄像头</button>
<div id="camMode"></div>
<script>
"use strict";

const CONFIG = {
  bgColor: '#000000',    // 纯黑:手机 OLED 上无限对比,光点最干净跳脱
  countFor(w) { return w < 640 ? 90 : 180; },
  colorStops: ['#FFD79A', '#F4A65A', '#FFC078'],
  sizeMin: 1.5, sizeMax: 4,
  gamma: 0.03, sigma: 0.08,
  attractRadius: 220, attractForce: 0.6,
  handGrace: 250,        // 手短暂丢失的宽限毫秒(防 active 闪烁)
  attractForceStrong: 1.4,   // 握拳:强聚
  repelForce: 0.9,           // 张手:推散
  openThreshold: 0.65,       // 展开度 > 此 → 推散(实测张开≈0.8)
  fistThreshold: 0.45,       // 展开度 < 此 → 强聚(实测握拳≈0.28)
  breathSpeed: 0.004,
  glowScale: 5,          // 外晕半径 = size × 此值
  haloAlpha: 0.3,        // 外晕亮度(压低,避免灰蒙蒙的薄雾)
  coreScale: 1.8,        // 实心亮核半径 = size × 此值
  coreColor: '#FFF6E0',  // 亮核色(近白暖,实心高亮)
};

// 标准正态随机(Box–Muller),供 Langevin/OU 的高斯白噪声使用
function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a})`;
}

// 外晕渐变:按平方反比软化衰减 I(r) ∝ 1/(1+(r/r0)²) 采样多停点,边缘归零。
// 物理依据:点光源辐照度随距离平方反比衰减(辐射度学)。
function glowGradient(x, y, radius, color, peak) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  const STOPS = 6;
  for (let i = 0; i <= STOPS; i++) {
    const t = i / STOPS;
    const inten = (1 / (1 + (t * 4) * (t * 4))) * (1 - t);
    g.addColorStop(t, hexA(color, peak * inten));
  }
  return g;
}

// 亮核渐变:中间 60% 保持满亮度(实心高亮平台),仅边缘羽化 → 真正"亮的点"。
function coreGradient(x, y, radius, color, peak) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, hexA(color, peak));
  g.addColorStop(0.6, hexA(color, peak));
  g.addColorStop(1, hexA(color, 0));
  return g;
}

class Particle {
  constructor(w, h) { this.reset(w, h); }
  reset(w, h) {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.vx = 0; this.vy = 0;
    this.size = CONFIG.sizeMin + Math.random() * (CONFIG.sizeMax - CONFIG.sizeMin);
    this.color = CONFIG.colorStops[(Math.random() * CONFIG.colorStops.length) | 0];
    this.phase = Math.random() * Math.PI * 2;
    this.baseAlpha = 0.7 + Math.random() * 0.3;
  }
}

class ParticleSystem {
  constructor() { this.particles = []; }
  init(w, h) {
    this.particles = [];
    const n = CONFIG.countFor(w);
    for (let i = 0; i < n; i++) this.particles.push(new Particle(w, h));
  }
}

// InputSource 接口约定:get() -> { x, y, active }
//   active=false 表示当前无吸引点(手机松手 / 桌面光标离开 / 摄像头未识别到手)
class PointerInput {
  constructor(el) {
    this.x = 0; this.y = 0; this.active = false;
    el.addEventListener('pointermove', (e) => {
      this.x = e.clientX; this.y = e.clientY;
      if (e.pointerType !== 'touch') this.active = true;
    });
    el.addEventListener('pointerdown', (e) => {
      this.x = e.clientX; this.y = e.clientY; this.active = true;
    });
    el.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'touch') this.active = false;
    });
    el.addEventListener('pointercancel', () => { this.active = false; });
    el.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'touch') this.active = false;
    });
  }
  get() { return { x: this.x, y: this.y, active: this.active }; }
}

// CameraInput:实现 InputSource 接口,与 PointerInput 可互换。懒加载本地 MediaPipe。
class CameraInput {
  constructor(videoEl) {
    this.video = videoEl;
    this.x = 0; this.y = 0; this.active = false;
    this.landmarker = null;
    this.stream = null;
    this.lastSeen = -Infinity;
    this.lastVideoTime = -1;
    this.openness = null;
    this.mode = 'neutral';
  }
  async start() {
    const { FilesetResolver, HandLandmarker } =
      await import('./vendor/tasks-vision/vision_bundle.mjs');
    const fileset = await FilesetResolver.forVisionTasks('./vendor/tasks-vision/wasm');
    this.landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: './vendor/hand_landmarker.task' },
      runningMode: 'VIDEO',
      numHands: 1
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    this.stream = stream;
    this.video.srcObject = stream;
    await this.video.play();
  }
  stop() {
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.active = false;
  }
  detect(now, w, h) {
    if (!this.landmarker || this.video.readyState < 2) return;
    if (this.video.currentTime === this.lastVideoTime) return;
    this.lastVideoTime = this.video.currentTime;
    const res = this.landmarker.detectForVideo(this.video, now);
    if (res.landmarks && res.landmarks.length > 0) {
      const palm = res.landmarks[0][9]; // 中指根 ≈ 手心,比指尖稳
      this.x = (1 - palm.x) * w;        // X 镜像(自拍视角)
      this.y = palm.y * h;
      this.lastSeen = now;
      this.active = true;
      const lm = res.landmarks[0];
      const scale = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 1e-6;
      const tips = [8, 12, 16, 20];
      let sum = 0;
      for (const t of tips) sum += Math.hypot(lm[t].x - lm[9].x, lm[t].y - lm[9].y);
      const openRaw = (sum / tips.length) / scale;
      this.openness = (this.openness == null) ? openRaw : this.openness * 0.7 + openRaw * 0.3;
      if (this.openness > CONFIG.openThreshold) this.mode = 'repel';
      else if (this.openness < CONFIG.fistThreshold) this.mode = 'attract';
      else this.mode = 'neutral';
      // 【留白·捏合】可加 拇指(4)-食指(8) 距离 → 更精细牵引(后续)
    } else if (now - this.lastSeen > CONFIG.handGrace) {
      this.active = false;
    }
  }
  get() { return { x: this.x, y: this.y, active: this.active, mode: this.mode }; }
}

// Theme 接口约定:init(particles,cfg) / update(particles,point,dt,time,w,h) / draw(ctx,particles,cfg)
const FireflyTheme = {
  init(particles, cfg) { /* 颜色与初态已在 Particle 构造时设置 */ },
  update(particles, point, dt, time, w, h) {
    const sqrtDt = Math.sqrt(dt);
    for (const p of particles) {
      // OU 布朗运动:高斯白噪声(√dt 缩放)+ 黏滞阻力 -γv
      p.vx += -CONFIG.gamma * p.vx * dt + CONFIG.sigma * sqrtDt * gaussian();
      p.vy += -CONFIG.gamma * p.vy * dt + CONFIG.sigma * sqrtDt * gaussian();
      // 吸引点:半径内朝吸引点的柔和加速度,随距离衰减
      if (point.active) {
        const dx = point.x - p.x, dy = point.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < CONFIG.attractRadius && dist > 0.001) {
          const falloff = (1 - dist / CONFIG.attractRadius) * dt;
          const dirx = dx / dist, diry = dy / dist;
          if (point.mode === 'repel') {
            const f = CONFIG.repelForce * falloff;
            p.vx -= dirx * f; p.vy -= diry * f;
          } else {
            const f = (point.mode === 'attract' ? CONFIG.attractForceStrong : CONFIG.attractForce) * falloff;
            p.vx += dirx * f; p.vy += diry * f;
          }
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) p.x += w; if (p.x > w) p.x -= w;
      if (p.y < 0) p.y += h; if (p.y > h) p.y -= h;
      p.phase += CONFIG.breathSpeed * dt * 16.67;
    }
  },
  draw(ctx, particles, cfg) {
    // 两层结构:外晕(带色散射)+ 实心亮核(近白高亮)。加色混合,重叠更亮。
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const breath = 0.7 + 0.3 * Math.sin(p.phase);
      const haloR = p.size * cfg.glowScale;
      ctx.fillStyle = glowGradient(p.x, p.y, haloR, p.color, breath * cfg.haloAlpha);
      ctx.beginPath();
      ctx.arc(p.x, p.y, haloR, 0, Math.PI * 2);
      ctx.fill();
      const coreR = p.size * cfg.coreScale;
      ctx.fillStyle = coreGradient(p.x, p.y, coreR, cfg.coreColor, breath * p.baseAlpha);
      ctx.beginPath();
      ctx.arc(p.x, p.y, coreR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
};

// 【留白·主题】未来实现 StarryNightTheme(梵高星空,曲线噪声流场 curl noise)
//   与 RippleTheme(水波,波函数)。实现 init/update/draw 后注册到 THEMES 即可:
//   THEMES.starrynight = StarryNightTheme;  通过 ?theme=starrynight 切换。

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// 背景作为画布后面的独立图层(此处用 CSS 纯深色)。
// 【留白·摄像头】以后把这层换/叠成全屏 <video> 实时画面,粒子(透明画布)即叠在真实环境上。
document.body.style.background = CONFIG.bgColor;
window.addEventListener('resize', resize);
resize();

const system = new ParticleSystem();
system.init(W, H);

const pointerInput = new PointerInput(canvas);
let activeInput = pointerInput;
const THEMES = { firefly: FireflyTheme };
const theme = THEMES[new URLSearchParams(location.search).get('theme')] || FireflyTheme;
theme.init(system.particles, CONFIG);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3);
  last = now;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H); // 透明画布:背景由后面的图层(CSS/未来摄像头)提供
  if (activeInput.detect) activeInput.detect(now, W, H);
  const point = activeInput.get();
  theme.update(system.particles, point, dt, now, W, H);
  theme.draw(ctx, system.particles, CONFIG);
  if (cameraOn) document.getElementById('camMode').textContent =
    activeInput.mode === 'repel' ? '散' : activeInput.mode === 'attract' ? '聚' : '·';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const camEl = document.getElementById('cam');
const scrimEl = document.getElementById('scrim');
const camBtn = document.getElementById('camBtn');
const cameraInput = new CameraInput(camEl);
let cameraOn = false;

camBtn.addEventListener('click', async () => {
  if (cameraOn) {
    cameraInput.stop();
    camEl.style.display = 'none';
    scrimEl.style.display = 'none';
    activeInput = pointerInput;
    cameraOn = false;
    camBtn.textContent = '开启摄像头';
    return;
  }
  camBtn.disabled = true; camBtn.textContent = '启动中…';
  try {
    await cameraInput.start();
    camEl.style.display = 'block';
    scrimEl.style.display = 'block';
    activeInput = cameraInput;
    cameraOn = true;
    camBtn.textContent = '关闭摄像头';
  } catch (e) {
    alert('摄像头开启失败:' + e.message + '\n(需 HTTPS 或 localhost;file:// 不支持)');
    camBtn.textContent = '开启摄像头';
  } finally { camBtn.disabled = false; }
});
</script>
</body>
</html>
